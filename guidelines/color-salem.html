<!-- @dsCard group="Colors" viewport="700x150" name="Salem — Primary green" subtitle="Brand primary #0A8754 and its dark section tints" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .sw { border-radius: 12px; overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; font-family: var(--font-body); }
  .name { font-size: 12px; font-weight: 600; color: var(--text-body); }
  .hex { font-size: 11px; color: var(--text-muted); letter-spacing: 0.01em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--color-salem-lightest)"></div><div class="meta"><div class="name">lightest</div><div class="hex">#E6F3ED</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--color-salem-lighter)"></div><div class="meta"><div class="name">lighter</div><div class="hex">#CEE7DC</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--color-salem-light)"></div><div class="meta"><div class="name">light</div><div class="hex">#53AB87</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--color-salem)"></div><div class="meta"><div class="name">salem ★</div><div class="hex">#0A8754</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--color-salem-dark)"></div><div class="meta"><div class="name">dark</div><div class="hex">#086C43</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--color-salem-darker)"></div><div class="meta"><div class="name">darker</div><div class="hex">#043621</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--color-salem-darkest)"></div><div class="meta"><div class="name">darkest</div><div class="hex">#032819</div></div></div>
  </div>
</body>
</html>
