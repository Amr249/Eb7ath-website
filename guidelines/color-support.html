<!-- @dsCard group="Colors" viewport="700x150" name="Spindle & Wedgewood — cool support" subtitle="Spindle blue for soft tint sections; Wedgewood teal accents" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); font-family: var(--font-body); }
  .grp { margin-bottom: 14px; }
  .lbl { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.04em; }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .sw { border-radius: 10px; overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 40px; }
  .hex { padding: 5px 7px; font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="grp">
    <div class="lbl">Spindle</div>
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--color-spindle-lightest)"></div><div class="hex">#F8FBFC</div></div>
      <div class="sw"><div class="chip" style="background:var(--color-spindle-lighter)"></div><div class="hex">#F2F7FA</div></div>
      <div class="sw"><div class="chip" style="background:var(--color-spindle-light)"></div><div class="hex">#D2E3F0</div></div>
      <div class="sw"><div class="chip" style="background:var(--color-spindle)"></div><div class="hex">#BFD7EA</div></div>
      <div class="sw"><div class="chip" style="background:var(--color-spindle-dark)"></div><div class="hex">#98ACBB</div></div>
      <div class="sw"><div class="chip" style="background:var(--color-spindle-darker)"></div><div class="hex">#4C565D</div></div>
      <div class="sw"><div class="chip" style="background:var(--color-spindle-darkest)"></div><div class="hex">#394046</div></div>
    </div>
  </div>
  <div class="grp">
    <div class="lbl">Wedgewood</div>
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--color-wedgewood-lightest)"></div><div class="hex">#EDF3F5</div></div>
      <div class="sw"><div class="chip" style="background:var(--color-wedgewood-lighter)"></div><div class="hex">#DCE8EC</div></div>
      <div class="sw"><div class="chip" style="background:var(--color-wedgewood-light)"></div><div class="hex">#84AEBF</div></div>
      <div class="sw"><div class="chip" style="background:var(--color-wedgewood)"></div><div class="hex">#508CA4</div></div>
      <div class="sw"><div class="chip" style="background:var(--color-wedgewood-dark)"></div><div class="hex">#407083</div></div>
      <div class="sw"><div class="chip" style="background:var(--color-wedgewood-darker)"></div><div class="hex">#203841</div></div>
      <div class="sw"><div class="chip" style="background:var(--color-wedgewood-darkest)"></div><div class="hex">#182A31</div></div>
    </div>
  </div>
</body>
</html>
