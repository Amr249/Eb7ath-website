<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); font-family: var(--font-body); color: var(--text-body); }
  .lead { font-size: 18px; line-height: 1.5; max-width: 560px; }
  .weights { display: flex; gap: 22px; margin-top: 16px; }
  .w span { display: block; font-size: 22px; }
  .w small { font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <p class="lead">Baheth connects Saudi doctors with active research teams and provides the academic support you need to advance your career.</p>
  <div class="weights">
    <div class="w"><span style="font-weight:400">Regular</span><small>Inter 400 · body</small></div>
    <div class="w"><span style="font-weight:500">Medium</span><small>Inter 500 · buttons</small></div>
    <div class="w"><span style="font-weight:600">Semibold</span><small>Inter 600 · labels</small></div>
    <div class="w"><span style="font-weight:700">Bold</span><small>Inter 700 · emphasis</small></div>
  </div>
</body>
</html>
