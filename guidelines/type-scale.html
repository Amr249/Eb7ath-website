<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); color: var(--text-body); }
  .r { display: flex; align-items: baseline; gap: 18px; padding: 6px 0; border-bottom: 1px solid var(--border-subtle); }
  .r:last-child { border-bottom: 0; }
  .tok { width: 120px; flex: none; font-family: var(--font-body); font-size: 11px; color: var(--text-muted); }
  .ser { font-family: var(--font-display); font-weight: 500; line-height: 1.1; }
  .san { font-family: var(--font-body); }
</style>
</head>
<body>
  <div class="r"><span class="tok">h1 · 72 / Fraunces</span><span class="ser" style="font-size:48px">Research</span></div>
  <div class="r"><span class="tok">h2 · 52</span><span class="ser" style="font-size:36px">Two ways to advance</span></div>
  <div class="r"><span class="tok">h3 · 44</span><span class="ser" style="font-size:30px">Numbers that matter</span></div>
  <div class="r"><span class="tok">h4 · 36</span><span class="ser" style="font-size:24px">Statistical analysis</span></div>
  <div class="r"><span class="tok">h5 · 28</span><span class="ser" style="font-size:20px">Cardiac risk assessment</span></div>
  <div class="r"><span class="tok">large · 22 / Inter</span><span class="san" style="font-size:18px">Lead paragraph copy</span></div>
  <div class="r"><span class="tok">medium · 18</span><span class="san" style="font-size:16px">Default body text size</span></div>
  <div class="r"><span class="tok">small · 14</span><span class="san" style="font-size:13px">Captions and meta</span></div>
</body>
</html>
