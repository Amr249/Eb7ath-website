<style>

  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: start; }

  .muted { color: var(--text-muted); }

<div id="root"></div>

              <div style={{fontWeight:700}}>Doctors supported</div>

          </Card>
        </div>
